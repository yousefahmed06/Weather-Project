name: fech, clean and predict

on:
  schedule:
    # Runs every 3 hours, matching the OpenWeatherMap forecast granularity.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest forecast data
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python fetch_weather.py

      - name: Validate, clean, and engineer features
        run: python process_weather.py

      - name: Train model and generate predictions
        run: python train_and_predict.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_data.csv weather_data_clean.csv weather_data_features.csv \
                  weather_predictions.csv linear_weather_model.pkl
          git diff --quiet --staged || git commit -m "Update weather data and predictions [skip ci]"
          git push
